plugins {
    id 'java'
    id 'application'
}

group = 'com.wygtv.ota'
version = '1.0'

repositories {
    mavenCentral()
}

application {
    mainClass = 'com.wygtv.tv.OtaDesktop'
    applicationName = 'wygota'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.named('jar') {
    archiveFileName = 'wygota.jar'
    manifest {
        attributes 'Main-Class': 'com.wygtv.tv.OtaDesktop'
    }
}
