plugins { id 'com.android.application' }

// WygOTA — antenna-TV-only app (com.wygtv.ota)
// Extracted from the original WygTV monorepo. Always builds as WygOTA.

android {
    namespace 'com.wygtv.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wygtv.ota'
        minSdk 23
        targetSdk 28
        versionCode((System.getenv('WYGOTA_VERSION_CODE') ?: System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.0.${System.getenv('WYGOTA_VERSION_CODE') ?: System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
        manifestPlaceholders = [appLabel: 'WygOTA']
        buildConfigField 'boolean', 'OTA', 'true'
        buildConfigField 'boolean', 'STORE', 'false'
        // Unused in OTA mode but kept so shared code compiles cleanly.
        buildConfigField 'String', 'TMDB_API_KEY', "\"\""
        buildConfigField 'String', 'OMDB_API_KEY', "\"\""
    }

    buildFeatures { buildConfig true }

    // Antenna icons and branding
    sourceSets {
        main {
            res.srcDirs = ['src/main/res', 'src/wygota/res']
        }
    }

    lint { warning 'ExpiredTargetSdkVersion' }

    // Permanent signing key. Prefer env (CI secret); fall back to committed keystore so updates match.
    def wygtvKey = System.getenv('WYGTV_KEYSTORE')
    def keyFile = (wygtvKey && file(wygtvKey).exists()) ? file(wygtvKey) : file('wygota.p12')
    def keyPass = System.getenv('WYGTV_KEY_PASSWORD') ?: 'wygota-signing-key'
    if (keyFile.exists()) {
        signingConfigs {
            wygtv {
                storeFile keyFile; storeType 'pkcs12'
                storePassword keyPass
                keyAlias 'wygtv'; keyPassword keyPass
            }
        }
        buildTypes {
            debug { signingConfig signingConfigs.wygtv }
            release { signingConfig signingConfigs.wygtv }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
    implementation 'androidx.media3:media3-exoplayer:1.9.1'
    implementation 'androidx.media3:media3-ui:1.9.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.9.1'
    // FFmpeg audio + video (MPEG-2, H.264, etc.) for HDHomeRun OTA on devices without hardware decoders
    implementation 'io.github.anilbeesetti:nextlib-media3ext:1.11.1-0.19.0'
}
